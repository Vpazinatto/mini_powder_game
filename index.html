<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini Powder Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        #toolbar {
            display: flex;
            z-index: 100;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            background: #444;
            color: white;
            font-size: 14px;
        }

        button:hover {
            background: #555;
        }

        button.active {
            background: #2e7d32;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<div id="toolbar"></div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
